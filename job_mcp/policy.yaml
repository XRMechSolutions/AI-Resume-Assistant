# job_mcp site policy. Read by job_mcp/config.py at server start; restart the MCP server after edits.
#
# Access kinds:
#   public sources  - official APIs/feeds, no login, spaced per host (http.min_delay_s)
#   browser_board   - the board's own search page in the logged-in Chrome window, at human pace
#
# Logged-in boards: sign in once by hand with the job_login tool (or `python -m job_mcp login <name>`).
# The profile lives in %LOCALAPPDATA%\job-mcp\chrome-profile (~/.job-mcp elsewhere; override: JOB_MCP_STATE_DIR),
# never in this repo.
# Automated browsing is against most boards' terms and can get an account flagged. The browser boards below
# ship disabled: set enabled: true only if you accept that risk. Keep max_pages_per_run low and the delays
# human so the session looks like a person paging through results.

http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"
  min_delay_s: 1.5

browser:
  channel: chrome              # the installed Google Chrome; "chromium" uses Playwright's bundled build
  page_delay_s: [6, 15]        # wait before each page load
  action_delay_s: [1.2, 3.5]   # wait before each click, fill or scroll step
  typing_delay_ms: [45, 140]   # per-keystroke delay for short answers
  max_snapshot_elements: 250

# Folders the browser may upload from, relative to the repo root. Only the per-application folder, so
# private source docs (Truth doc, voice samples) can never be attached by mistake. Copy a base resume
# into the job's folder before uploading it.
upload_roots:
  - JobSearches

sources:
  # ---------- company ATS boards (best source: apply early, direct to the company) ----------
  # companies: the board token from each company's careers URL, e.g. job-boards.greenhouse.io/<token>,
  # jobs.lever.co/<token>, jobs.ashbyhq.com/<token>. Replace these examples with companies you target.
  greenhouse:
    kind: greenhouse
    enabled: true
    companies: [gitlab, elastic]
  lever:
    kind: lever
    enabled: false
    companies: []
  ashby:
    kind: ashby
    enabled: true
    companies: [clickhouse, supabase, elevenlabs, livekit]

  # ---------- public remote feeds ----------
  remotive:
    kind: remotive
    enabled: true
    category: software-dev
  remoteok:
    kind: remoteok
    enabled: true
  weworkremotely:
    kind: weworkremotely
    enabled: true
    categories: [remote-programming-jobs, remote-full-stack-programming-jobs, remote-back-end-programming-jobs]
  hn_hiring:
    kind: hn_hiring
    enabled: true
  himalayas:
    kind: himalayas
    enabled: true

  # ---------- logged-in boards (browser) ----------
  # search_url placeholders: {query}, {page} (1-based), {offset} (0-based, page * page_size).
  # job_link_pattern: JS regex matched against every link's absolute href; groups feed canonical_url as {1}, {2}.
  # verified: set true once a live search returns correct titles.
  linkedin:
    kind: browser_board
    enabled: false   # opt in: see the terms-of-service note at the top
    verified: false
    login_url: "https://www.linkedin.com/login"
    cookie_domain: linkedin.com
    session_cookie: li_at
    search_url: "https://www.linkedin.com/jobs/search/?keywords={query}&f_WT=2&sortBy=DD&start={offset}"
    page_size: 25
    job_link_pattern: "linkedin\\.com/jobs/view/(?:[^/?#]*-)?(\\d{6,})"
    canonical_url: "https://www.linkedin.com/jobs/view/{1}"
    max_pages_per_run: 2
    logged_out_url_markers: [authwall, /login, /signup, checkpoint]
  flexjobs:
    kind: browser_board
    enabled: false   # opt in: see the terms-of-service note at the top
    verified: false
    login_url: "https://www.flexjobs.com/login"
    cookie_domain: flexjobs.com
    search_url: "https://www.flexjobs.com/search?searchkeyword={query}&page={page}"
    page_size: 50
    job_link_pattern: "flexjobs\\.com/(?:publicjobs|remote-jobs|HostedJob)/[^?#]+"
    max_pages_per_run: 2
    logged_out_url_markers: [/login, /registration]
  arcdev:
    kind: browser_board
    enabled: false   # opt in: see the terms-of-service note at the top
    verified: false
    login_url: "https://arc.dev/login"
    cookie_domain: arc.dev
    search_url: "https://arc.dev/remote-jobs?search={query}&page={page}"
    page_size: 20
    job_link_pattern: "arc\\.dev/remote-jobs/(?:details|j)/[^?#]+"
    max_pages_per_run: 2
    logged_out_url_markers: [/login, /signup]
  indeed:
    kind: browser_board
    enabled: false   # heavy bot checks; enable after LinkedIn/FlexJobs prove stable
    verified: false
    login_url: "https://secure.indeed.com/auth"
    cookie_domain: indeed.com
    search_url: "https://www.indeed.com/jobs?q={query}&l=Remote&sort=date&start={offset}"
    page_size: 10
    job_link_pattern: "indeed\\.com/.*[?&]jk=([0-9a-f]{16})"
    canonical_url: "https://www.indeed.com/viewjob?jk={1}"
    max_pages_per_run: 2
    logged_out_url_markers: [/auth, captcha]
